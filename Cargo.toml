[workspace]
resolver = "2"
# Listed, not "crates/*": Cargo expands that pattern with the folder's own
# path in front, so a source folder with [ ] in its name (C:\Games\[PS2]\...)
# fails to build. A new crate goes in both lists.
members = [
    "crates/ee-analyze",
    "crates/ee-recomp",
    "crates/ee-runtime",
    "crates/flm",
    "crates/freek-config",
    "crates/freek-input",
    "crates/freekstyle-hd",
    "crates/gs",
    "crates/gs-vulkan",
    "crates/ps2-iop",
    "crates/r5900",
    "freekstyle",
    "launcher",
]
# `freekstyle` needs generated code from ee-recomp; build it explicitly with -p.
default-members = [
    "crates/ee-analyze",
    "crates/ee-recomp",
    "crates/ee-runtime",
    "crates/flm",
    "crates/freek-config",
    "crates/freek-input",
    "crates/freekstyle-hd",
    "crates/gs",
    "crates/gs-vulkan",
    "crates/ps2-iop",
    "crates/r5900",
    "launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The oldest Rust the dependencies build with (linux-install.py checks it).
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

# The generated code is huge; keep debug builds usable.
[profile.dev.package.freekstyle]
opt-level = 1

# Line tables only: readable profiles and backtraces at no runtime cost.
# Thin LTO: the renderer ~5-8% faster at the start line in a replay
# (identical frames), and no slower to build (the generated game code
# dominates). Not codegen-units = 1: that builds the game code on one core.
[profile.release]
debug = "line-tables-only"
lto = "thin"
