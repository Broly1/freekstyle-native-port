[workspace]
resolver = "2"
members = ["crates/*", "freekstyle", "launcher"]
# `freekstyle` needs generated code from ee-recomp; build it explicitly with -p.
default-members = ["crates/*", "launcher"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# The generated code is huge; keep debug builds usable.
[profile.dev.package.freekstyle]
opt-level = 1

# Line tables only: readable profiles and backtraces at no runtime cost.
[profile.release]
debug = "line-tables-only"
