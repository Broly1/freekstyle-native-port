# x86-64-v2 (SSE4.2, 2008+ Intel, 2011+ AMD): SSE4.1 blends make the
# VU float emulation (clamps and flushes after every op) much shorter.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# SDL3 (controllers) is built from source by the cmake crate, which reads
# this per-target variable; see crates/freek-input/sdl-console.cmake.
[env]
CMAKE_TOOLCHAIN_FILE_x86_64_unknown_linux_gnu = { value = "crates/freek-input/sdl-console.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_gnu = { value = "crates/freek-input/sdl-console.cmake", relative = true }
